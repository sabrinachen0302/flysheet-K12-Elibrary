<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>高中電子圖書館</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&display=swap">
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="_ds_bundle.js"></script>
<style>body{margin:0;background:var(--color-bg);font-family:var(--font-base);color:var(--color-text)}a{color:var(--color-text)}a:hover{color:var(--color-text);text-decoration-color:var(--color-brand-cta)}#root{width:1440px}::highlight(k12-search){background:#FFE45C;color:inherit}</style></head><body><div id="root"></div>
<script type="text/babel" src="js/Books.app.js"></script>
<script type="text/babel" src="js/News.app.js"></script>
<script type="text/babel" src="js/Favorites.app.js"></script>
<script type="text/babel" src="js/Preview.app.js"></script>
<script type="text/babel" src="js/Shelf.app.js"></script>
<script type="text/babel" src="js/Home.app.js"></script>
<script type="text/babel" src="js/BookDetail.app.js"></script>
<script type="text/babel" src="js/Categories.app.js"></script>
<script type="text/babel" src="js/CurationList.app.js"></script>
<script type="text/babel" src="js/Journey.app.js"></script>
<script type="text/babel" src="js/Curation.app.js"></script>
<script type="text/babel" src="js/SearchResults.app.js"></script>
<script type="text/babel" src="js/Topics.app.js"></script>
<script type="text/babel" src="js/Curriculum.app.js"></script>
<script type="text/babel" src="js/Resources.app.js"></script>
<script type="text/babel">
const { Footer: AppFooter, Navigation: RetroNav } = window.DesignSystem_65d3d1;
const SITE_SETTINGS = {"shelfMode": "先展示封面", "spineAuthor": true};
function App() {
  const t = SITE_SETTINGS;
  const favs = window.useFavs();
  const [newsOpen, setNewsOpen] = React.useState(false);
  const favCount = new Set(favs.folders.flatMap(f => f.items)).size;
  const toResSearch = () => { const ty = localStorage.getItem("k12-res-type"); localStorage.removeItem("k12-res-type"); localStorage.setItem("k12-search", JSON.stringify({ terms: [], applied: ty ? [ty] : [], scope: ["電子資源"] })); window.__k12sn = (window.__k12sn || 0) + 1; return "search"; };
  const [page, setPage] = React.useState(() => { const p = localStorage.getItem("k12-page") || "home"; return p.startsWith("resources") ? toResSearch() : p === "landing" ? "home" : p; });
  const [, tick] = React.useReducer(x => x + 1, 0);
  const go = (p) => { if (p.startsWith("resources")) p = toResSearch(); setPage(p); tick(); localStorage.setItem("k12-page", p); window.scrollTo(0, 0); };
  const Screen = { home: window.HomeScreen, detail: window.BookDetailScreen, categories: window.CategoriesScreen, "categories-nonfiction": (p) => <window.CategoriesScreen {...p} initialType="nonfiction" />, "categories-audio": (p) => <window.CategoriesScreen {...p} initialType="audio" />, "categories-magazine": (p) => <window.CategoriesScreen {...p} initialType="magazine" />, "categories-news": (p) => <window.CategoriesScreen {...p} initialType="news" />, search: window.SearchResultsScreen, curation: window.CurationScreen, curations: window.CurationListScreen, "topics-fiction": (p) => <window.TopicsScreen {...p} />, "topics-magazine": (p) => <window.TopicsScreen {...p} initialFmt="電子雜誌" />, "topics-news": (p) => <window.TopicsScreen {...p} initialFmt="新聞" />, "topics-audio": (p) => <window.TopicsScreen {...p} initialFmt="有聲書" />, "topics-nonfiction": (p) => <window.TopicsScreen {...p} jumpTo="非小說作品主題" />, curriculum: window.CurriculumScreen, favorites: window.FavoritesScreen, resources: window.ResourcesScreen, "resources-ncku": window.ResourcesScreen }[page] || window.HomeScreen;
  const onNavigate = (l) => go(l === "我的收藏" ? "favorites" : "home");
  const onBrowse = (l) => l === "自主學習" ? (localStorage.setItem("k12-res-type", "自主學習"), go("resources")) : go(l === "依課綱探索" ? "curriculum" : l === "文學小說類" ? "topics-fiction" : l === "電子雜誌" ? "topics-magazine" : l === "新聞" ? "topics-news" : l === "線上資源" ? "resources" : l === "主題書單" ? "curations" : l === "非小說類" ? "categories-nonfiction" : "categories");
  return (
    <div style={{ position: "relative", background: "var(--color-bg)" }}>
      <RetroNav style={page === "curation" ? { position: "sticky", top: 0, zIndex: 5000 } : undefined} links={["最新消息", "登入 / 註冊", "關於電子圖書館", "聯絡我們"]} onLinkClick={(l) => l === "最新消息" && setNewsOpen(o => !o)} search={!["home", "search"].includes(page)} centered={["home", "search"].includes(page)} bar onTitleClick={() => go("home")} active={page === "home" ? "電子圖書館首頁" : page === "favorites" ? "我的收藏" : undefined} onNavigate={onNavigate} onBrowse={onBrowse} onSearch={() => go("search")} items={[{ label: "電子圖書館首頁" }, { label: "瀏覽", chevron: true }, { label: "我的收藏", count: favCount }]} />
      <main><Screen key={page === "detail" ? "detail-" + localStorage.getItem("k12-book") : page === "search" ? "search-" + (window.__k12sn || 0) : page} go={go} tweaks={t} /></main>
      {<AppFooter style={{ background: "var(--color-brand-mint)", borderTop: "var(--border-default)" }} />}
      {newsOpen && <window.NewsPopover onClose={() => setNewsOpen(false)} />}
      <window.FavToast />
      <window.PreviewHost go={go} />
    </div>
  );
}
function fit(){const r=document.getElementById('root');const s=Math.min(1,window.innerWidth/1440);r.style.zoom=s;}
window.addEventListener('resize',fit);fit();
Promise.all((window.K12_LOADERS || []).map(f => f())).catch(e => console.error("資料載入失敗", e)).then(() => ReactDOM.createRoot(document.getElementById('root')).render(<App/>));
</script></body></html>
